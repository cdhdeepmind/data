    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#ADD8E6", "id": "A", "label": "A", "physics": false, "shape": "circle", "x": 0, "y": 0}, {"color": "#90EE90", "id": "B", "label": "B", "physics": false, "shape": "circle", "x": 200, "y": 0}, {"color": "#FFB6C1", "id": "C", "label": "C", "physics": false, "shape": "circle", "x": 400, "y": 0}, {"color": "blue", "id": "linea", "label": "a", "physice": false, "shape": "circle", "x": 0, "y": -100}, {"color": "blue", "id": "lineb", "label": "b", "physice": false, "shape": "circle", "x": 400, "y": -100}, {"color": "#888888", "id": "line0", "label": "line0", "physics": false, "shape": "box", "size": 100, "x": -100, "y": -80}, {"color": "#888888", "id": "line1", "label": "line1", "physics": false, "shape": "box", "size": 100, "x": 0, "y": -80}, {"color": "#888888", "id": "line2", "label": "line2", "physics": false, "shape": "box", "size": 100, "x": 100, "y": -80}, {"color": "#888888", "id": "line3", "label": "line3", "physics": false, "shape": "box", "size": 100, "x": 200, "y": -80}, {"color": "#888888", "id": "line4", "label": "line4", "physics": false, "shape": "box", "size": 100, "x": 300, "y": -80}, {"color": "#888888", "id": "line5", "label": "line5", "physics": false, "shape": "box", "size": 100, "x": 400, "y": -80}, {"color": "#97c2fc", "id": "A_label", "label": "Start Node", "physics": false, "shape": "text", "x": 0, "y": -120}, {"color": "#97c2fc", "id": "B_label", "label": "Middle Node", "physics": false, "shape": "text", "x": 200, "y": -120}, {"color": "#97c2fc", "id": "C_label", "label": "End Node", "physics": false, "shape": "text", "x": 400, "y": -120}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "A", "to": "B"}, {"arrows": "to", "from": "B", "to": "C"}, {"arrows": "to", "from": "linea", "to": "lineb"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
